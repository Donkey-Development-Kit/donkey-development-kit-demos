# Optional OTel backend for the DDK demo: Tempo (traces) + Grafana (UI).
#
#   docker compose up -d
#   export OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
#   export OTEL_SERVICE_NAME=ddk-demo
#   ../run.sh
#
# Then open Grafana at http://localhost:3000 (anonymous, Admin) →
# Explore → Tempo → Search, and watch the `donkey.llm.chat` spans arrive.
services:
  tempo:
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "4318:4318" # OTLP HTTP — DDK's zero-config export target
      - "4317:4317" # OTLP gRPC
      - "3200:3200" # Tempo query API

  grafana:
    image: grafana/grafana:11.3.0
    depends_on:
      - tempo
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "3000:3000"
